name: CI

# PR마다 바뀐 쪽(backend / frontend)만 검사한다.
# 승인 없이 작성자가 머지하는 규칙이라, 이 검사가 통과해야 머지되도록
# Rulesets에서 "Require status checks to pass"에 backend / frontend 를 추가한다.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      frontend_ready: ${{ steps.fe.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - id: fe
        # 프론트 프로젝트가 아직 생성되지 않았으면(package.json 없음) 프론트 검사를 건너뛴다
        run: |
          if [ -f frontend/package.json ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "ready=false" >> "$GITHUB_OUTPUT"; fi
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Format check
        # Spotless 설정 전에는 이 태스크가 없으므로 건너뛴다
        run: |
          if ./gradlew tasks --all -q | grep -q '^spotlessCheck'; then
            ./gradlew spotlessCheck
          else
            echo "spotlessCheck not configured yet, skipping"
          fi
      - name: Test
        # Testcontainers는 러너의 Docker를 사용한다. 외부 API 실호출 테스트(@Tag("external"))는 제외한다.
        run: ./gradlew test

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' && needs.changes.outputs.frontend_ready == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

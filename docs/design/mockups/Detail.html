<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>물품 상세</title>
<style>
@font-face{font-family:'IBM Plex Sans KR';font-style:normal;font-weight:400;font-display:block;src:url(../../../frontend/src/styles/fonts/ibm-plex-sans-kr-korean-400-normal.woff2) format('woff2');unicode-range:U+1100-11FF,U+3000-303F,U+3130-318F,U+A960-A97F,U+AC00-D7A3,U+D7B0-D7FF,U+FF00-FFEF}
@font-face{font-family:'IBM Plex Sans KR';font-style:normal;font-weight:400;font-display:block;src:url(../../../frontend/src/styles/fonts/ibm-plex-sans-kr-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122,U+2190-21FF,U+2212}

@font-face{font-family:'IBM Plex Sans KR';font-style:normal;font-weight:500;font-display:block;src:url(../../../frontend/src/styles/fonts/ibm-plex-sans-kr-latin-500-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122,U+2190-21FF,U+2212}
@font-face{font-family:'IBM Plex Sans KR';font-style:normal;font-weight:600;font-display:block;src:url(../../../frontend/src/styles/fonts/ibm-plex-sans-kr-korean-600-normal.woff2) format('woff2');unicode-range:U+1100-11FF,U+3000-303F,U+3130-318F,U+A960-A97F,U+AC00-D7A3,U+D7B0-D7FF,U+FF00-FFEF}
@font-face{font-family:'IBM Plex Sans KR';font-style:normal;font-weight:600;font-display:block;src:url(../../../frontend/src/styles/fonts/ibm-plex-sans-kr-latin-600-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122,U+2190-21FF,U+2212}
@font-face{font-family:'IBM Plex Sans KR';font-style:normal;font-weight:700;font-display:block;src:url(../../../frontend/src/styles/fonts/ibm-plex-sans-kr-korean-700-normal.woff2) format('woff2');unicode-range:U+1100-11FF,U+3000-303F,U+3130-318F,U+A960-A97F,U+AC00-D7A3,U+D7B0-D7FF,U+FF00-FFEF}
@font-face{font-family:'IBM Plex Sans KR';font-style:normal;font-weight:700;font-display:block;src:url(../../../frontend/src/styles/fonts/ibm-plex-sans-kr-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122,U+2190-21FF,U+2212}
body{margin:0}
a{color:#1F6F54}a:hover{color:#174F3D}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; background: #FFFFFF; font-family: 'IBM Plex Sans KR', sans-serif; color: #1C1C1A">

  <div style="height: 236px; flex: none; position: relative; background: #EDEBE5; display: flex; align-items: center; justify-content: center">
    <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#A3A39C" stroke-width="1.2" stroke-linejoin="round" aria-hidden="true"><path d="M3 20h18L12 4 3 20z"/><path d="M12 4v16"/></svg>
    <a href="Home.html" aria-label="뒤로" style="position: absolute; top: 8px; left: 8px; width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.92); display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1C1C1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <span style="position: absolute; right: 12px; bottom: 12px; padding: 3px 9px; border-radius: 999px; background: rgba(28,28,26,0.72); color: #FFFFFF; font-size: 12px">1 / 4</span>
  </div>

  <main style="flex: 1; overflow: hidden; display: flex; flex-direction: column; padding: 0 16px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid #F0EEE9">
      <div style="width: 40px; height: 40px; border-radius: 50%; background: #D9E6DF; flex: none"></div>
      <div style="display: flex; flex-direction: column; gap: 1px">
        <span style="font-size: 15px; font-weight: 600">캠핑조아</span>
        <span style="font-size: 12px; color: #5C5F5A">연수동 · 거래 12회</span>
      </div>
      <div style="margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 4px">
        <span style="font-size: 12px; color: #5C5F5A">신뢰 점수 <b style="color: #1F6F54; font-size: 15px">72</b></span>
        <div style="width: 84px; height: 6px; border-radius: 3px; background: #E4E2DC"><div style="width: 72%; height: 6px; border-radius: 3px; background: #1F6F54"></div></div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px; padding-top: 14px">
      <h1 style="margin: 0; font-size: 21px; font-weight: 700; letter-spacing: -0.01em">4인용 거실형 텐트</h1>
      <span style="font-size: 13px; color: #5C5F5A">캠핑·아웃도어 · 사용감 적음 · 3분 전</span>
      <p style="margin: 8px 0 0; font-size: 15px; line-height: 1.6">주말 캠핑용으로 두 번 사용했어요. 폴대·팩·스트링 모두 포함이고, 설치 방법은 만날 때 알려 드릴게요.</p>
    </div>

    <section style="display: flex; flex-direction: column; gap: 8px; padding-top: 16px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <h2 style="margin: 0; font-size: 16px; font-weight: 700">대여 캘린더</h2>
        <span style="font-size: 13px; color: #5C5F5A">10월</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; text-align: center; font-size: 13px">
        <span style="color: #8B8E88; font-size: 12px">일</span><span style="color: #8B8E88; font-size: 12px">월</span><span style="color: #8B8E88; font-size: 12px">화</span><span style="color: #8B8E88; font-size: 12px">수</span><span style="color: #8B8E88; font-size: 12px">목</span><span style="color: #8B8E88; font-size: 12px">금</span><span style="color: #8B8E88; font-size: 12px">토</span>
        <span style="padding: 6px 0; color: #C9C7C0">27</span><span style="padding: 6px 0; color: #C9C7C0">28</span><span style="padding: 6px 0; color: #C9C7C0">29</span><span style="padding: 6px 0; color: #C9C7C0">30</span><span style="padding: 6px 0">1</span><span style="padding: 6px 0">2</span><span style="padding: 6px 0; border-radius: 8px; background: #F6F5F1; color: #A3A39C; text-decoration: line-through">3</span>
        <span style="padding: 6px 0; border-radius: 8px; background: #F6F5F1; color: #A3A39C; text-decoration: line-through">4</span><span style="padding: 6px 0">5</span><span style="padding: 6px 0">6</span><span style="padding: 6px 0">7</span><span style="padding: 6px 0">8</span><span style="padding: 6px 0">9</span><span style="padding: 6px 0">10</span>
      </div>
      <span style="font-size: 12px; color: #5C5F5A">취소선 날짜는 이미 예약된 기간이에요</span>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px; padding-top: 14px">
      <h2 style="margin: 0; font-size: 16px; font-weight: 700">거래 장소</h2>
      <div style="height: 76px; border-radius: 10px; background: #E8EEE6; display: flex; align-items: center; gap: 8px; padding: 0 14px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F6F54" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.5 7-12a7 7 0 00-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>
        <span style="font-size: 14px; font-weight: 500">연수동 ○○공원 정문</span>
      </div>
    </section>
  </main>

  <div style="flex: none; display: flex; align-items: center; gap: 10px; padding: 12px 16px 16px; border-top: 1px solid #E4E2DC; background: #FFFFFF">
    <button type="button" aria-label="관심 추가" style="width: 44px; height: 44px; border: 0; background: none; display: flex; align-items: center; justify-content: center; flex: none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1C1C1A" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.6-7 10-7 10z"/></svg></button>
    <div style="flex: 1; display: flex; flex-direction: column; border-left: 1px solid #E4E2DC; padding-left: 12px; min-width: 0">
      <span style="font-size: 17px; font-weight: 700">15,000원<span style="font-size: 13px; font-weight: 500; color: #5C5F5A"> /일</span></span>
      <span style="font-size: 12px; font-weight: 600; color: #8F560F">보증금 50,000원</span>
    </div>
    <a href="Chat.html" style="height: 48px; padding: 0 14px; border: 1px solid #1F6F54; border-radius: 12px; background: #FFFFFF; color: #1F6F54; display: flex; align-items: center; font-size: 15px; font-weight: 600; text-decoration: none; flex: none; box-sizing: border-box">채팅하기</a>
    <a href="Booking.html" style="height: 48px; padding: 0 16px; border-radius: 12px; background: #1F6F54; color: #FFFFFF; display: flex; align-items: center; font-size: 15px; font-weight: 600; text-decoration: none; flex: none">예약하기</a>
  </div>
</div>
</body>
</html>

# 부하 테스트 전용 구성 (chore/load-test). 개발용 local compose·운영 compose와 따로 띄운다. 사용법: scripts/load/README.md
#   docker compose -f infra/docker-compose.load.yml up -d --build
# MySQL·Redis·RabbitMQ를 이 프로젝트(rental-load) 안에 따로 두고, DB 이름을 rental_load로 고정한다.
# 그래서 개발 DB(rental)나 운영 RDS에 더미 데이터가 들어갈 수 없다. 앱은 운영처럼 2개, 앞에 Nginx 1개(라운드로빈).
# 앱 자원 상한은 운영 t3.small 기준에 맞춘다: 메모리 1200m·힙 768m, CPU 2개.
name: rental-load

x-backend: &backend
  image: rental-backend:load
  depends_on:
    mysql: { condition: service_healthy }
    redis: { condition: service_started }
    rabbitmq: { condition: service_started }
  environment:
    # prod 프로필은 S3·운영 비밀값을 요구하므로 local 프로필에 접속 정보만 환경 변수로 넘긴다
    SPRING_PROFILES_ACTIVE: local
    DB_HOST: mysql
    DB_PORT: "3306"
    DB_NAME: rental_load
    DB_USERNAME: rental
    DB_PASSWORD: rental
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    RABBITMQ_HOST: rabbitmq
    RABBITMQ_PORT: "5672"
    RABBITMQ_STOMP_PORT: "61613"
    RABBITMQ_USERNAME: guest
    RABBITMQ_PASSWORD: guest
    MAIL_HOST: localhost
    MAIL_PORT: "1025"
    # 부하 테스트 전용 값(비밀 아님)
    JWT_SECRET: load-test-only-jwt-secret-not-for-production-0123456789
    APP_FEATURE_PAYMENT_ENABLED: "false"
    # local 프로필의 SQL 디버그 로그를 끈다(로그 출력이 응답 시간을 왜곡하지 않게)
    LOGGING_LEVEL_ORG_HIBERNATE_SQL: info
    APP_STORAGE_LOCAL_ROOT_DIR: /tmp/uploads
    TRUSTED_PROXY_REGEX: '172[.]29[.]0[.]10'
    JAVA_MAX_HEAP: 768m
  mem_limit: 1200m
  cpus: 2
  networks: [load]

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: rental_load
      MYSQL_USER: rental
      MYSQL_PASSWORD: rental
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Seoul
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-time-zone=+09:00
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 30
    # 결과 확인용으로만 연다(개발 MySQL 3306과 겹치지 않게)
    ports: ["13306:3306"]
    volumes: [load-mysql:/var/lib/mysql]
    networks: [load]

  redis:
    image: redis:7-alpine
    networks: [load]

  rabbitmq:
    image: rabbitmq:4-management
    command: >
      bash -c "rabbitmq-plugins enable --offline rabbitmq_stomp && rabbitmq-server"
    networks: [load]

  # 이미지는 backend1에서만 빌드하고 backend2는 같은 이미지를 쓴다(동시에 같은 태그를 빌드하면 충돌)
  backend1:
    <<: *backend
    build: ../backend

  backend2:
    <<: *backend
    depends_on:
      backend1: { condition: service_started }
      mysql: { condition: service_healthy }

  nginx:
    image: nginx:1.28-alpine
    depends_on: [backend1, backend2]
    volumes:
      - ../scripts/load/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["18080:80"]
    networks:
      load:
        ipv4_address: 172.29.0.10

  # k6는 필요할 때만: docker compose -f infra/docker-compose.load.yml run --rm k6 run /scripts/read-mix.js
  k6:
    image: grafana/k6:2.4.0
    profiles: [k6]
    environment:
      BASE_URL: http://nginx
    volumes:
      - ../scripts/load:/scripts
    networks: [load]

networks:
  load:
    ipam:
      config:
        - subnet: 172.29.0.0/24

volumes:
  load-mysql:

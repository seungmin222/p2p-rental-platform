# 운영 1번 서버(EC2 t3.small, Elastic IP): Nginx + Spring Boot + Redis. 런북: infra/README.md
# 실행: infra/deploy/deploy.sh server1 [이미지 태그]  (= docker compose -f infra/docker-compose.server1.yml --env-file <.env> up -d)
# 외부에 여는 포트는 Nginx 80뿐. Redis 6379는 사설 IP에만 바인딩하고 보안 그룹으로 2번 서버만 허용한다.
name: rental

services:
  nginx:
    image: ${IMAGE_REGISTRY:-ghcr.io/seungmin222}/rental-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on: [backend]
    environment:
      SERVER2_PRIVATE_IP: ${SERVER2_PRIVATE_IP:?2번 서버 사설 IP}
      ORIGIN_VERIFY_SECRET: ${ORIGIN_VERIFY_SECRET:?CloudFront X-Origin-Verify 값}
    ports: ["80:80"]
    networks:
      app:
        # 1번 앱의 TRUSTED_PROXY_REGEX가 이 주소만 신뢰한다. 바꾸면 아래 backend도 같이 바꾼다
        ipv4_address: 172.28.0.10
    mem_limit: 64m
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  backend:
    image: ${IMAGE_REGISTRY:-ghcr.io/seungmin222}/rental-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      redis: { condition: service_healthy }
    env_file: ["${ENV_FILE:-/opt/rental/.env}"]
    # env_file보다 우선한다. 서버마다 다른 값만 여기서 정한다
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      RABBITMQ_HOST: ${SERVER2_PRIVATE_IP:?2번 서버 사설 IP}
      TRUSTED_PROXY_REGEX: '172[.]28[.]0[.]10'
    # 포트를 호스트에 열지 않는다. Nginx만 compose 네트워크로 접근
    networks: [app]
    mem_limit: 1200m
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # RT·조회수 중복 키·ShedLock·Redisson 락을 담으므로 메모리 부족 시 지우지 않고 오류를 낸다(noeviction)
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?Redis 비밀번호}
      - --appendonly
      - "yes"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Redis 비밀번호}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    ports: ["${SERVER1_PRIVATE_IP:?1번 서버 사설 IP}:6379:6379"]
    networks: [app]
    volumes: [redis-data:/data]
    mem_limit: 192m
    logging: *logging

networks:
  app:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  redis-data:

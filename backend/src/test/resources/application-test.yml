# 테스트: MySQL·Redis·RabbitMQ 접속 정보는 Testcontainers(@ServiceConnection)가 주입한다.
app:
  feature:
    payment-enabled: false
  payment:
    toss:
      # 테스트는 FakePaymentGateway를 쓰고 토스를 부르지 않는다. 결제를 켠 컨텍스트의 기동 검사만 통과시킨다
      secret-key: test-secret-key
  jwt:
    secret: test-jwt-secret-must-be-at-least-32-bytes-long
  shedlock:
    environment: test
  batch:
    item-view-count-cron: "-"
    # 배치는 테스트에서 직접 호출한다
    cancel-agreement-expire-cron: "-"
    return-auto-confirm-cron: "-"
    payment-expire-cron: "-"
    rental-extension-expire-cron: "-"
    no-handover-cancel-cron: "-"
    refund-retry-cron: "-"
    payment-reconcile-cron: "-"
    overdue-detect-cron: "-"
    overdue-recheck-cron: "-"
    handover-reminder-cron: "-"
    return-reminder-cron: "-"
    deduction-auto-accept-cron: "-"
    settlement-payout-cron: "-"
  storage:
    local:
      root-dir: build/test-uploads
      url-prefix: /files

spring:
  rabbitmq:
    listener:
      simple:
        # AI 비교 리스너(REQ-040)를 띄우지 않는다. 앞 테스트의 메시지가 TRUNCATE 뒤 같은 id의 다음 테스트 데이터를 건드리지 않게.
        # 큐 소비 경로는 AiCompareQueueIntegrationTest가 리스너를 직접 켜서 검증한다
        auto-startup: false
  jpa:
    properties:
      # 쿼리 수 단언용(Statistics.getPrepareStatementCount). 세션마다 찍히는 통계 로그는 아래에서 끈다
      hibernate:
        generate_statistics: true

logging:
  level:
    org.hibernate.engine.internal.StatisticalLoggingSessionEventListener: WARN

# 운영: 모든 접속 정보는 실제 환경 변수로 주입한다. 기본값을 두지 않아 누락 시 기동 실패.
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?characterEncoding=UTF-8&connectionTimeZone=Asia/Seoul
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

app:
  shedlock:
    environment: prod
  storage:
    # S3FileStorage. 자격 증명은 AWS SDK 기본 체인(AWS_ACCESS_KEY_ID·AWS_SECRET_ACCESS_KEY 또는 EC2 역할)
    s3:
      region: ${AWS_REGION}
      bucket: ${AWS_S3_BUCKET}
      # CDN을 붙이면 AWS_S3_PUBLIC_URL로 교체
      public-url: ${AWS_S3_PUBLIC_URL:https://${AWS_S3_BUCKET}.s3.${AWS_REGION}.amazonaws.com}

# 운영에서는 Swagger UI와 API 문서를 노출하지 않는다
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

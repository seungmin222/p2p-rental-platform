# 운영: 모든 접속 정보는 실제 환경 변수로 주입한다. 기본값을 두지 않아 누락 시 기동 실패.
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?characterEncoding=UTF-8&connectionTimeZone=Asia/Seoul
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      # 운영 Redis는 다른 서버에서도 접속하므로 requirepass를 건다 (infra/docker-compose.server1.yml)
      password: ${REDIS_PASSWORD}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
  # 비밀번호 재설정 메일 (REQ-036). SMTP 인증·STARTTLS
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

app:
  frontend:
    base-url: ${FRONTEND_BASE_URL}
  mail:
    from: ${MAIL_FROM}
  shedlock:
    environment: prod
  storage:
    # S3FileStorage. 자격 증명은 AWS SDK 기본 체인(AWS_ACCESS_KEY_ID·AWS_SECRET_ACCESS_KEY 또는 EC2 역할)
    s3:
      region: ${AWS_REGION}
      bucket: ${AWS_S3_BUCKET}
      # 운영은 CloudFront 주소 + /files (infra/README.md). 키가 없으면 버킷 주소(빈 값은 기본값을 쓰지 않는다)
      public-url: ${AWS_S3_PUBLIC_URL:https://${AWS_S3_BUCKET}.s3.${AWS_REGION}.amazonaws.com}

# 운영에서는 Swagger UI와 API 문서를 노출하지 않는다
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

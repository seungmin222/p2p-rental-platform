# 로컬 개발: backend/ 에서 실행하는 기준으로 infra/.env 를 설정값으로 읽는다.
spring:
  config:
    import: optional:file:../infra/.env[.properties]
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?characterEncoding=UTF-8&connectionTimeZone=Asia/Seoul
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

logging:
  level:
    org.hibernate.SQL: debug

app:
  security:
    permit-swagger: true
  shedlock:
    # ShedLock 락 키 접두사(job-lock:{environment}:{name}). 프로필마다 다르게
    environment: local
  storage:
    # LocalFileStorage: backend/에서 실행 기준 ./uploads 에 저장, /files/** 로 서빙 (AWS 키 불필요)
    local:
      root-dir: ./uploads
      url-prefix: /files

# 공통 설정. 인프라 접속 정보는 프로필별 파일(local / prod)에 둔다.
spring:
  application:
    name: rental
  autoconfigure:
    # JWT만 쓰므로 기본 메모리 사용자(generated security password)를 만들지 않는다
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway만 바꾼다. 엔티티와 다르면 기동 실패 (local 포함)
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # docs/policies.md upload.max-file-size / upload.max-request-size. 용도별 한도는 ImageProcessor에서 다시 검사
      max-file-size: 10MB
      max-request-size: 110MB

server:
  tomcat:
    # 한도 초과 요청 본문을 Tomcat이 이만큼은 읽고 버린 뒤 400 JSON을 보낸다. 기본값(2MB)이면 15MB 사진 한 장에도
    # 응답 전에 연결이 끊긴다. max-request-size와 같게 (docs/policies.md upload 행)
    max-swallow-size: 110MB

app:
  feature:
    # 1순위 단계는 false (docs/architecture.md §9)
    payment-enabled: ${APP_FEATURE_PAYMENT_ENABLED:false}
  jwt:
    # 32바이트(256bit) 미만이면 기동 실패 (JwtProvider)
    secret: ${JWT_SECRET}
    # docs/policies.md auth.access-token-ttl / auth.refresh-token-ttl
    access-token-ttl: 30m
    refresh-token-ttl: 14d
  security:
    # Swagger 경로 공개 여부. local 프로필에서만 true
    permit-swagger: false
  batch:
    # 배치 주기 (docs/policies.md 배치 주기). test 프로필은 "-"로 끈다
    # 양측 동의 취소 요청 만료: 10분 (REQ-015)
    cancel-agreement-expire-cron: "0 */10 * * * *"
  policy:
    # docs/policies.md 수치. 바꾸면 policies.md도 함께 수정 (PolicyProperties)
    image:
      original-max-long-side: 1600
      thumbnail-width: 400
      # 60MP
      max-pixels: 60000000
    region:
      # region.verify-valid-days: 인증 후 30일이 지나면 만료 (REQ-004)
      verify-valid-days: 30
    trust:
      # trust.initial: 가입 시 50점 (REQ-001, REQ-054). members.trust_score DB 기본값과 같게
      initial-score: 50.0
    rental:
      # rental.min-days / rental.max-days: 최초 예약 일수 (REQ-013)
      min-days: 1
      max-days: 30
      # rental.lock-wait: 분산 락 대기. 임대 시간은 지정하지 않는다(watchdog 자동 연장)
      lock-wait: 3s
    payment:
      # payment.expire-minutes: 결제 대기(PENDING_PAYMENT) 기간 선점 시간 (REQ-013, REQ-024)
      expire-minutes: 15
    cancel:
      # cancel.reason-text-max: 취소 사유 텍스트 최대 글자 수, 사유 OTHER면 필수 (REQ-015). rentals.cancel_reason_text VARCHAR(200)과 같게
      reason-text-max: 200
    cancel-fee:
      # cancel-fee.rate-percent / free-until-days-before: 대여자 단독 취소 수수료. 시작일 3일 전까지 무료, 그 뒤 대여료의 30% (REQ-015)
      rate-percent: 30
      free-until-days-before: 3
    cancel-agreement:
      # cancel-agreement.expire-hours: 양측 동의 취소 요청이 상대 무응답으로 만료되는 시간 (REQ-015)
      expire-hours: 48

springdoc:
  # @RestControllerAdvice의 응답(400·401·500…)을 모든 API에 붙이지 않는다. 에러 응답은 @ApiErrorCodes로만 선언
  override-with-generic-response: false
  default-produces-media-type: application/json
  # docs/openapi.json diff가 실행마다 흔들리지 않게 키 정렬
  writer-with-order-by-keys: true

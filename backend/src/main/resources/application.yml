# 공통 설정. 인프라 접속 정보는 프로필별 파일(local / prod)에 둔다.
spring:
  application:
    name: rental
  autoconfigure:
    # JWT만 쓰므로 기본 메모리 사용자(generated security password)를 만들지 않는다
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway만 바꾼다. 엔티티와 다르면 기동 실패 (local 포함)
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    # 반납 요청 커밋 뒤 AI 비교 큐 적재가 요청 스레드에서 돈다(REQ-040). 브로커가 죽었을 때 오래 붙잡지 않게
    connection-timeout: 3s
    listener:
      simple:
        # 리스너 예외로 같은 메시지가 끝없이 다시 오지 않게 (RabbitConfig)
        default-requeue-rejected: false
  servlet:
    multipart:
      # docs/policies.md upload.max-file-size / upload.max-request-size. 용도별 한도는 ImageProcessor에서 다시 검사
      max-file-size: 10MB
      max-request-size: 110MB

server:
  forward-headers-strategy: native
  tomcat:
    remoteip:
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto
      # 미설정 시 어떤 프록시도 신뢰하지 않는다. 실제 Nginx 접속 IP만 정규식으로 지정.
      internal-proxies: '${TRUSTED_PROXY_REGEX:(?!)}'
      trusted-proxies: '(?!)'
    # 한도 초과 요청 본문을 Tomcat이 이만큼은 읽고 버린 뒤 400 JSON을 보낸다. 기본값(2MB)이면 15MB 사진 한 장에도
    # 응답 전에 연결이 끊긴다. max-request-size와 같게 (docs/policies.md upload 행)
    max-swallow-size: 110MB

app:
  stomp:
    # 채팅·알림 STOMP 브로커 릴레이(RabbitMQ rabbitmq_stomp) 포트 (REQ-027). 호스트·계정은 spring.rabbitmq.*를 같이 쓴다
    relay-port: ${RABBITMQ_STOMP_PORT:61613}
  redis:
    command-timeout: 1s
    connect-timeout: 1s
    retry-attempts: 0
  feature:
    # 1순위 단계는 false (docs/architecture.md §9)
    payment-enabled: ${APP_FEATURE_PAYMENT_ENABLED:false}
  payment:
    toss:
      base-url: https://api.tosspayments.com
      secret-key: ${TOSS_SECRET_KEY:}
      connect-timeout: 3s
      # 토스 문서에 일반 승인·취소의 권장값이 없다 (docs/prompts/feat/payment-core/notes.md)
      read-timeout: 30s
  ai:
    # Claude API (REQ-040). 키가 비어 있으면 호출하지 않고 FAILED로 남긴다(거래 흐름은 그대로)
    api-key: ${ANTHROPIC_API_KEY:}
    # docs/domains/ai.md 모델
    model: claude-haiku-4-5
    max-tokens: 1024
    # 검증 목표 30초 이내 (ai.md). 요청 한 번의 제한 시간
    timeout: 30s
    # SDK 재시도(429·5xx·연결 오류, 과금 안 됨). 응답 형식 오류 재시도(ai.max-retry)와 별개
    sdk-max-retries: 2
  jwt:
    # 32바이트(256bit) 미만이면 기동 실패 (JwtProvider)
    secret: ${JWT_SECRET}
    # docs/policies.md auth.access-token-ttl / auth.refresh-token-ttl
    access-token-ttl: 30m
    refresh-token-ttl: 14d
  security:
    # Swagger 경로 공개 여부. local 프로필에서만 true
    permit-swagger: false
  batch:
    item-view-count-cron: "0 */5 * * * *"
    # 배치 주기 (docs/policies.md 배치 주기). test 프로필은 "-"로 끈다
    # 양측 동의 취소 요청 만료: 10분 (REQ-015)
    cancel-agreement-expire-cron: "0 */10 * * * *"
    # 자동 상태 확인(반납 요청 후 return.auto-confirm-days): 1시간 (REQ-018)
    return-auto-confirm-cron: "0 0 * * * *"
    # 결제 만료: 1분 (REQ-024)
    payment-expire-cron: "0 * * * * *"
    # 연장 결제 만료: 1분 (REQ-038)
    rental-extension-expire-cron: "0 * * * * *"
    # 인계 없음 자동 취소: 매일 09:00 (REQ-017)
    no-handover-cancel-cron: "0 0 9 * * *"
    # 연체 감지: 매일 00:05 + 매시 정각 재검사 (REQ-023)
    overdue-detect-cron: "0 5 0 * * *"
    overdue-recheck-cron: "0 0 * * * *"
    # 인계 리마인더: 매일 09:00 (REQ-017)
    handover-reminder-cron: "0 0 9 * * *"
    # 반납 리마인더: 매일 09:00 (REQ-031)
    return-reminder-cron: "0 0 9 * * *"
    # 차감 제안 자동 수락(deduction.renter-response-hours): 1시간 (REQ-049)
    deduction-auto-accept-cron: "0 15 * * * *"
    # 환불 재시도: 10분 (REQ-025)
    refund-retry-cron: "0 */10 * * * *"
    # PG 조정: 1시간 (REQ-024)
    payment-reconcile-cron: "0 30 * * * *"
    # 정산 지급: 매일 (REQ-039). 지급 예정일 당일에 지급되도록 자정 직후에 돈다
    settlement-payout-cron: "0 30 0 * * *"
  policy:
    feed:
      page: 20
    my-items:
      page: 20
    item-rentals:
      page: 20
    # notification.page: 알림 목록 페이지 크기. size 파라미터를 받지 않는다 (REQ-032)
    notification:
      page: 20
    inquiry:
      # inquiry.content-max: 문의 내용 최대 글자 수, 공백만은 불가 (REQ-063). inquiries.content VARCHAR(1000)과 같게
      content-max: 1000
      # inquiry.page: 내 문의 목록 페이지 크기. size 파라미터를 받지 않는다 (REQ-063)
      page: 20
    chat:
      # chat.message.max: 채팅 메시지 최대 글자 수, 공백만은 불가 (REQ-027). chat_messages.content VARCHAR(1000)과 같게
      message-max: 1000
      # chat.history.page: 메시지 내역 한 번에 가져오는 건수. size 파라미터를 받지 않는다 (REQ-028)
      history-page: 50
    view-count:
      dedupe-hours: 24
    profile:
      # docs/policies.md profile.image: 5MB
      image-max-size: 5MB
    # docs/policies.md 수치. 바꾸면 policies.md도 함께 수정 (PolicyProperties)
    image:
      original-max-long-side: 1600
      thumbnail-width: 400
      # 60MP
      max-pixels: 60000000
    region:
      range:
        normal-meters: 3000
      max-per-member: 2
      # region.verify-valid-days: 인증 후 30일이 지나면 만료 (REQ-004)
      verify-valid-days: 30
    trust:
      # trust.initial: 가입 시 50점 (REQ-001, REQ-054). members.trust_score DB 기본값과 같게
      initial-score: 50.0
    rental:
      # rental.min-days / rental.max-days: 최초 예약 일수 (REQ-013)
      min-days: 1
      max-days: 30
      # rental.lock-wait: 분산 락 대기. 임대 시간은 지정하지 않는다(watchdog 자동 연장)
      lock-wait: 3s
    payment:
      # payment.expire-minutes: 결제 대기(PENDING_PAYMENT) 기간 선점 시간 (REQ-013, REQ-024)
      expire-minutes: 15
    cancel:
      # cancel.reason-text-max: 취소 사유 텍스트 최대 글자 수, 사유 OTHER면 필수 (REQ-015). rentals.cancel_reason_text VARCHAR(200)과 같게
      reason-text-max: 200
    cancel-fee:
      # cancel-fee.rate-percent / free-until-days-before: 대여자 단독 취소 수수료. 시작일 3일 전까지 무료, 그 뒤 대여료의 30% (REQ-015)
      rate-percent: 30
      free-until-days-before: 3
    overdue-fee:
      # overdue-fee.rate: 연체 1일당 일 대여료 × 150%, 보증금 한도 (REQ-023)
      rate-percent: 150
    lost-report:
      # lost-report.after-days: 반납 예정일 + 7일이 지난 연체 건부터 제공자가 미반납 신고 가능 (REQ-018, REQ-049)
      after-days: 7
    deduction:
      # deduction.reason.max: 차감 사유 500자. deduction_proposals.reason·payments.deduction_reason VARCHAR(500)과 같게 (REQ-049)
      reason-max: 500
      # deduction.renter-response-hours: 차감 제안에 대여자 72시간 무응답이면 자동 수락 (REQ-049)
      renter-response-hours: 72
    deposit:
      # deposit.hold-agreement-days: 보류 시작 후 7일 미합의 → 관리자 확정 대상 (REQ-049)
      hold-agreement-days: 7
    settlement:
      # settlement.fee-rate: 10%, 원 미만 절사. 대여료·연장료·연체료·취소 수수료에 적용 (REQ-039)
      fee-rate-percent: 10
      # settlement.payout-delay: 완료(취소)일 + 영업일 2일, 주말만 제외 (REQ-039)
      payout-delay-business-days: 2
      # settlement.page: 정산 내역 페이지 크기. size 파라미터를 받지 않는다 (REQ-039)
      page: 20
    payment-history:
      # payment-history.default-range: from·to를 생략하면 최근 3개월 (REQ-033)
      default-range-months: 3
      # payment-history.page: 결제·보증금 내역 페이지 크기. size 파라미터를 받지 않는다 (REQ-033)
      page: 20
    extension:
      # extension.max-count / max-days-per: 대여 한 건당 2회, 한 번에 7일 (REQ-038). 결제 대기는 payment.expire-minutes
      max-count: 2
      max-days-per: 7
    cancel-agreement:
      # cancel-agreement.expire-hours: 양측 동의 취소 요청이 상대 무응답으로 만료되는 시간 (REQ-015)
      expire-hours: 48
    handover:
      # handover.auto-cancel-days: 시작일 + 3일까지 인계 확인이 없으면 자동 취소, 전액 환불 (REQ-017, REQ-015)
      auto-cancel-days: 3
    refund:
      # refund.retry: 10분 간격, 최대 5회. 다 실패하면 관리자 확인 플래그 (REQ-025)
      max-retry: 5
      interval: 10m
    reconciliation:
      # reconciliation.lookback-hours: 조정 배치가 대조하는 최근 결제 범위. 초기 가정 (REQ-024)
      lookback-hours: 24
    inspection:
      images:
        # inspection.images.min / max / max-file-size: 인계·반납·판정 사진 1~5장, 장당 10MB (REQ-017, REQ-018)
        min: 1
        max: 5
        max-file-size: 10MB
      # inspection.handover-memo-max: 인계 메모 (REQ-017). item_inspections.note VARCHAR(300)과 같게
      handover-memo-max: 300
      # inspection.abnormal-note-max: 상태 확인 '이상' 내용 (REQ-018). item_inspections.result_note VARCHAR(500)과 같게
      abnormal-note-max: 500
    # PolicyProperties.returnPolicy (return은 Java 예약어라 @Name("return")으로 바인딩)
    return:
      # return.note-max: 반납 메모, 체크리스트에 false 항목이 있으면 필수 (REQ-018). item_inspections.note VARCHAR(300)과 같게
      note-max: 300
      # return.auto-confirm-days: 반납 요청 후 3일이 지나면 자동 '정상' 처리 (REQ-018)
      auto-confirm-days: 3
    review:
      # review.write-deadline-days: 거래 완료(completed_at) 후 후기 작성 기한 (REQ-034, 빌린 내역 canWriteReview REQ-019)
      write-deadline-days: 7
      # review.content.max: 후기 내용 최대 글자 수 (REQ-034). reviews.content VARCHAR(300)과 같게
      content-max: 300
      # review.page: 받은 후기 목록 페이지 크기. size 파라미터를 받지 않는다 (REQ-034)
      page: 20
    rental-history:
      # rental-history.page: 빌린 내역 페이지 크기. size 파라미터를 받지 않는다 (REQ-019)
      page: 20
    member:
      # member.email.max: 이메일 최대 100자 (REQ-001)
      email-max: 100
      # member.password: 8~20자, 공백 없는 ASCII 출력 문자만·영문·숫자·기호 각 1개 이상(구성은 DTO @Pattern) (REQ-001, REQ-005)
      password:
        min: 8
        max: 20
      # member.nickname: 2~10자 (REQ-001, REQ-005)
      nickname:
        min: 2
        max: 10
    item:
      images:
        min: 1
        max: 10
        max-file-size: 10MB
      # item.name.max / item.description.max: 50자 / 2,000자 (REQ-006)
      name-max: 50
      description-max: 2000
      # item.price-per-day: 0원(무료) 또는 1,000원 ~ 1,000,000원 (REQ-006)
      price-per-day:
        min: 1000
        max: 1000000
      # item.deposit: 0원 또는 1,000원 ~ 3,000,000원 (REQ-006)
      deposit:
        min: 1000
        max: 3000000
      # item.item-price.max: 0 ~ 10,000,000원, 대여자에게 비공개 (REQ-006)
      item-price-max: 10000000
    ai:
      # ai.monthly-limit: 월 1,000건, 기능 공통, 재시도도 1건. 넘으면 AI 없이 진행 (REQ-040·067)
      monthly-limit: 1000
      # ai.max-retry: 응답 형식 오류면 최대 2회 재시도 (REQ-040·067)
      max-retry: 2
      # ai.image-max-long-side: 보내기 전 긴 변 1024px로 축소 (REQ-040·067, 명세 외)
      image-max-long-side: 1024
      compare:
        # ai.compare.processing-timeout-minutes: 10분 넘게 PROCESSING이면 응답에서 FAILED (REQ-040, 명세 외)
        processing-timeout-minutes: 10
      category:
        # ai.category.timeout-seconds: 요청 하나에서 AI를 기다리는 총 시간 20초, 재시도 포함 (REQ-067, 명세 외)
        timeout-seconds: 20
        # ai.category.per-member-daily: 회원당 하루 10회. 넘으면 LIMIT_EXCEEDED (REQ-067, 명세 외)
        per-member-daily: 10

springdoc:
  # @RestControllerAdvice의 응답(400·401·500…)을 모든 API에 붙이지 않는다. 에러 응답은 @ApiErrorCodes로만 선언
  override-with-generic-response: false
  default-produces-media-type: application/json
  # docs/openapi.json diff가 실행마다 흔들리지 않게 키 정렬
  writer-with-order-by-keys: true

plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '8.10.3'
	id 'org.springdoc.openapi-gradle-plugin' version '1.9.0'
}

group = 'com.team7'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
	springdocVersion = '3.1.1'
	querydslVersion = '7.7'
	shedlockVersion = '7.10.1'
	redissonVersion = '4.7.0'
	jjwtVersion = '0.13.0'
	awsSdkVersion = '2.55.6'
}

dependencyManagement {
	imports {
		mavenBom "software.amazon.awssdk:bom:${awsSdkVersion}"
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-amqp'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'org.flywaydb:flyway-mysql'

	// API 문서 (Swagger)
	implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

	// 동적 조회 (OpenFeign 포크. com.querydsl과 섞지 않는다)
	implementation "io.github.openfeign.querydsl:querydsl-jpa:${querydslVersion}"
	annotationProcessor "io.github.openfeign.querydsl:querydsl-apt:${querydslVersion}:jpa"
	annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
	annotationProcessor 'jakarta.annotation:jakarta.annotation-api'

	// 배치 단일 실행
	implementation "net.javacrumbs.shedlock:shedlock-spring:${shedlockVersion}"
	implementation "net.javacrumbs.shedlock:shedlock-provider-redis-spring:${shedlockVersion}"

	// 분산 락
	implementation "org.redisson:redisson-spring-boot-starter:${redissonVersion}"

	// JWT (Boot 4 기본 Jackson 3과 섞이지 않도록 Gson 직렬화 사용)
	implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
	runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
	runtimeOnly "io.jsonwebtoken:jjwt-gson:${jjwtVersion}"

	// 파일 저장소 (S3Client 빈은 prod 프로필에서만 생성)
	implementation 'software.amazon.awssdk:s3'

	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-amqp-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-websocket-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-mysql'
	testImplementation 'org.testcontainers:testcontainers-rabbitmq'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform {
		// 외부 API 실호출 테스트는 기본 빌드에서 제외
		excludeTags 'external'
	}
}

// docs/openapi.json 생성: local 프로필로 기동하므로 로컬 인프라가 떠 있어야 한다
openApi {
	outputDir.set(file("${rootDir}/../docs"))
	outputFileName.set('openapi.json')
	customBootRun {
		args.set(['--spring.profiles.active=local'])
	}
}

// 네이버 핵데이 Java 컨벤션. 설정 원본: github.com/naver/hackday-conventions-java (rule-config/)
spotless {
	java {
		target 'src/**/*.java'
		lineEndings = com.diffplug.spotless.LineEnding.UNIX
		eclipse().configFile('config/naver-eclipse-formatter.xml')
		importOrderFile('config/naver.importorder')
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
	}
}

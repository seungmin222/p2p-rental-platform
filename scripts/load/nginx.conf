# 부하 테스트용 Nginx (infra/docker-compose.load.yml). 운영 설정(infra/nginx/templates)에서 /api 프록시·upstream만 남겼다.
# CloudFront 비밀 헤더·SPA 정적 파일·웹소켓은 이번 시나리오와 관계없어 뺐다.
log_format load '$remote_addr [$time_local] "$request" $status $request_time up=$upstream_addr ut=$upstream_response_time';

upstream rental_backend {
    server backend1:8080 max_fails=3 fail_timeout=10s;
    server backend2:8080 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

server {
    listen 80 default_server;
    access_log /var/log/nginx/access.log load;

    location /api/ {
        proxy_pass http://rental_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
    }
}
